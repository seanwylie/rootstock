name: Bug report
description: Something behaves differently than documented.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This project is maintained as time permits. Do not include account ids,
        Terraform state, or cloud credentials.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected, what you got.
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.12"
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: "`uv run pytest -q` passes (or I have included the failure)"
        - label: I am not reporting a live AWS apply against example account ids
