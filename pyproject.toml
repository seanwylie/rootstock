[project]
name = "rootstock"
version = "0.0.0"
description = "Autonomous venture operating system under deterministic governance constraints"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Sean Wylie" }]
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
]

[project.urls]
Homepage = "https://github.com/seanwylie/rootstock"
Repository = "https://github.com/seanwylie/rootstock"
Issues = "https://github.com/seanwylie/rootstock/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "moto[s3,sqs,dynamodb,sts]>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "boto3-stubs[s3,sqs,dynamodb,sts,ssm,iam]>=1.35",
    "pip-audit>=2.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rootstock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "scripts"]
markers = [
    "destructive: talks to real AWS and deliberately breaks things (deselect with '-m \"not destructive\"')",
    "live: talks to real AWS for phase exit criteria (deselect with '-m \"not live\"')",
]
addopts = "-m 'not destructive and not live'"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "scripts"]
mypy_path = ["src", "scripts"]
